name: Build and Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not configured in repository secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/SOE-release.jks"
          chmod 600 "${{ github.workspace }}/SOE-release.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/SOE-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi
          $GRADLE_CMD :app:assembleRelease --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Dksp.incremental=false

      - name: Verify APK Signature
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found at app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Verifying APK: $RELEASE_APK"

          # Locate apksigner tool in Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi

          # Verify signature (fails if unsigned or invalid)
          echo "Running apksigner verification..."
          $APKSIGNER verify --verbose "$RELEASE_APK"
          if [ $? -ne 0 ]; then
            echo "ERROR: APK is not signed or has invalid signature!"
            exit 1
          fi

          echo "=================================================="
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "=================================================="
          # Print certificate fingerprints for verification
          $APKSIGNER verify --print-certs "$RELEASE_APK" | grep -E "(Signer|SHA-256|SHA-1|Certificate DN)" || true

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SOE-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/SOE-release.jks"
          rm -f "SOE-release.jks"
